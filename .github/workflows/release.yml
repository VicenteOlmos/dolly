name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dolly
          POSTGRES_PASSWORD: dolly
          POSTGRES_DB: dolly
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dolly -d dolly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOLLY_TEST_PG_DSN: postgres://dolly:dolly@127.0.0.1:5433/dolly?sslmode=disable
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate SemVer tag and protected main tip
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tag must be SemVer vX.Y.Z" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Release tag must be SemVer vX.Y.Z" >&2
            exit 1
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "Tagged commit $GITHUB_SHA is not current protected main tip $main_sha" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL 16 client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - run: go vet ./...

      - run: go test -race -count=1 ./...

      - run: sh test/install-behavior.sh

      - run: go test -tags=integration -p 1 -count=1 ./...

      - name: Build release assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export DATE
          COMMIT="$(git rev-parse --short HEAD)"
          export COMMIT
          sh scripts/build-release-assets.sh dist

      - name: Verify release asset manifest
        run: |
          set -eu
          for file in \
            dolly_linux_x86_64.tar.gz \
            dolly_linux_arm64.tar.gz \
            dolly_darwin_x86_64.tar.gz \
            dolly_darwin_arm64.tar.gz \
            dolly_windows_x86_64.zip \
            dolly_windows_arm64.zip \
            checksums.txt
          do
            test -s "dist/$file"
          done
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 7
          (cd dist && sha256sum -c checksums.txt)

      - name: Verify release binary version
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          verify_dir="$(mktemp -d)"
          tar -xzf dist/dolly_linux_x86_64.tar.gz -C "$verify_dir"
          chmod +x "$verify_dir/dolly"
          out="$("$verify_dir/dolly" version)"
          printf '%s\n' "$out" | grep -Fq "dolly $EXPECTED_VERSION "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to clobber" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes

      - name: Upload and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -eu
          gh release upload "$RELEASE_TAG" dist/*
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" -eq 7

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
