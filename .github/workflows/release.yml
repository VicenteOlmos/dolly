name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dolly
          POSTGRES_PASSWORD: dolly
          POSTGRES_DB: dolly
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dolly -d dolly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOLLY_TEST_PG_DSN: postgres://dolly:dolly@127.0.0.1:5433/dolly?sslmode=disable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL 16 client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Resolve release version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - run: go vet ./...

      - run: go test -race -count=1 ./...

      - run: sh test/install-behavior.sh

      - run: go test -tags=integration -p 1 -count=1 ./...

      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          export DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export COMMIT="$(git rev-parse --short HEAD)"
          sh scripts/build-release-assets.sh dist

      - name: Verify release asset manifest
        run: |
          set -eu
          for file in \
            dolly_linux_x86_64.tar.gz \
            dolly_linux_arm64.tar.gz \
            dolly_darwin_x86_64.tar.gz \
            dolly_darwin_arm64.tar.gz \
            dolly_windows_x86_64.zip \
            dolly_windows_arm64.zip \
            checksums.txt
          do
            test -s "dist/$file"
          done
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes

      - name: Upload and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" -eq 7

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
