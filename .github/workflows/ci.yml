name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      - if: runner.os != 'Windows'
        run: go test -race -count=1 ./...

      - if: runner.os == 'Windows'
        name: Run Windows lock runtime tests
        run: go test -race -count=1 ./internal/connections ./internal/dumphistory

      - if: runner.os == 'Windows'
        name: Compile remaining tests on Windows
        run: go test -race -run '^$' ./...

      - run: go build -buildvcs=false ./cmd/dolly

      - if: runner.os != 'Windows'
        run: sh -n install.sh

      - if: runner.os != 'Windows'
        run: sh test/install-behavior.sh

      - if: runner.os == 'Windows'
        run: pwsh -NoProfile -File test/install-behavior.ps1

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dolly
          POSTGRES_PASSWORD: dolly
          POSTGRES_DB: dolly
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dolly -d dolly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOLLY_TEST_PG_DSN: postgres://dolly:dolly@127.0.0.1:5433/dolly?sslmode=disable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL 16 client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - run: go test -tags=integration -p 1 -count=1 ./...
