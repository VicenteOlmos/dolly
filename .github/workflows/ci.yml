name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for all jobs. No repository secrets; fork PRs stay untrusted.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out SHA
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            Write-Error "checked-out SHA mismatch: expected $expected actual $actual"
            exit 1
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      - if: runner.os != 'Windows'
        run: go test -race -count=1 ./...

      - if: runner.os == 'Windows'
        name: Run Windows permission cache runtime tests
        run: go test -race -count=1 -run 'TestPermissionCache(WindowsRuntime|ReplacementFailurePreservesBytes|ConcurrentOutcomes)$' ./internal/clone

      - if: runner.os == 'Windows'
        name: Run Windows cache lock runtime tests
        run: go test -race -count=1 -run '^TestCacheLock' ./internal/clone

      - if: runner.os == 'Windows'
        name: Run Windows lock runtime tests
        run: go test -race -count=1 ./internal/connections ./internal/dumphistory

      - if: runner.os == 'Windows'
        name: Run Windows config runtime tests (slice only)
        run: go test -race -count=1 -run '^(TestEnsureOwnerOnly|TestLoadConfigTightens|TestLoadDotEnv.*Tightens|TestLoadDotEnv.*FailClosed|TestSaveConfigFailClosed)' ./internal/config

      - if: runner.os == 'Windows'
        name: Compile remaining tests on Windows
        run: go test -race -run '^$' ./...

      - run: go build -buildvcs=false ./cmd/dolly

      - if: runner.os != 'Windows'
        run: sh -n install.sh

      - if: runner.os != 'Windows'
        run: sh test/install-behavior.sh

      - if: runner.os == 'Windows'
        run: pwsh -NoProfile -File test/install-behavior.ps1

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dolly
          POSTGRES_PASSWORD: dolly
          POSTGRES_DB: dolly
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dolly -d dolly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOLLY_TEST_PG_DSN: postgres://dolly:dolly@127.0.0.1:5433/dolly?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL 16 client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - run: go test -tags=integration -p 1 -count=1 ./...
