name: Bug Report
description: Report unexpected behavior or a regression
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, DSNs, dump contents, or production data.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you expected and what actually happened.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Dolly version
      description: Output of `dolly version`
      placeholder: dolly 0.1.1 (commit abc123, built 2026-07-27T00:00:00Z)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal commands or workflow that reproduces the issue.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Command output or error messages. Redact secrets before posting.
