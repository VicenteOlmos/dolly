services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dolly
      POSTGRES_PASSWORD: dolly
      POSTGRES_DB: dolly
    ports:
      - "5433:5432"
    volumes:
      - ./internal/testutil/pgintegration/fixtures.sql:/docker-entrypoint-initdb.d/01-fixtures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolly -d dolly"]
      interval: 2s
      timeout: 5s
      retries: 10
